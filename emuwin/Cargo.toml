[package]
name = "emuwin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CBE 模拟器的 Windows 外壳（Win32）"

[[bin]]
name = "NiecheEmu"
path = "src/main.rs"

[features]
default = ["core"]

core = ["dep:emucore"]

mock = []

[dependencies]
emucore = { path = "../emucore", optional = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
